{% extends 'base.html' %}

{% block title %}{{music.name}}{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}

    <p>Band {{album.band.name}}</p>

    <h3>
        Are you sure you want to delete the album <b>{{album.name}}</b>?
    </h3>

    <button type="submit" class="btn btn-primary mt-2">Delete</button>
</form>

{% endblock %}
