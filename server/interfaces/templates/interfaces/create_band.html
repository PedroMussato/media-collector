{% extends 'base.html' %}

{% block title %}Create band{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}

    <div>
        <label class="form-label">Band name:</label>
        <input name="name" type="text" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary mt-2">Create</button>
</form>

{% endblock %}
