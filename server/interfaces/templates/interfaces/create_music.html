{% extends 'base.html' %}

{% block title %}Create music{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}

    <h3>Band {{album.band.name}} album {{album.name}}</h3>

    <div>
        <label class="form-label">Music track:</label>
        <input name="track" type="number" class="form-control">
    </div>

    <div>
        <label class="form-label">Music name:</label>
        <input name="name" type="text" class="form-control">
    </div>

    <div>
        <label class="form-label">YouTube URL:</label>
        <input
            type="url"
            name="yt_url"
            class="form-control"
            placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <button type="submit" class="btn btn-primary mt-2">Create</button>
</form>

{% endblock %}
